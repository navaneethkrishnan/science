<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Minimalist Portfolio</title>
    <style>
        /* ... (പഴയ അതേ CSS കോഡ് ഇവിടെ വരും. CSS മാറ്റമൊന്നുമില്ല) ... */
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-main: #ffffff;
            --bg-secondary: #f4f4f5;
            --text-primary: #18181b;
            --text-secondary: #71717a;
            --accent-color: #000000;
            --section-spacing: 120px;
            --border-radius: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); overflow-x: hidden; line-height: 1.5; }
        
        header { position: fixed; top: 0; left: 0; width: 100%; padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); z-index: 100; }
        .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.05em; }
        nav ul { display: flex; list-style: none; gap: 2rem; }
        .nav-link { cursor: pointer; color: var(--text-secondary); font-weight: 500; font-size: 0.95rem; transition: all 0.3s ease; position: relative; }
        .nav-link:hover, .nav-link.active { color: var(--text-primary); }
        .nav-link.active::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--accent-color); border-radius: 50%; }
        
        main { padding-top: 80px; min-height: 100vh; position: relative; }
        
        .page-section { position: absolute; top: 80px; left: 0; width: 100%; padding: 60px 5% var(--section-spacing) 5%; opacity: 0; visibility: hidden; transform: translateY(30px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); background: var(--bg-main); }
        .page-section.active { opacity: 1; visibility: visible; transform: translateY(0); z-index: 10; }
        
        h1.huge-title { font-size: clamp(3.5rem, 10vw, 7rem); line-height: 1.05; letter-spacing: -0.04em; font-weight: 800; margin-bottom: 2rem; }
        h2 { font-size: 2.5rem; letter-spacing: -0.03em; margin-bottom: 1.5rem; }
        p.lead { font-size: 1.25rem; color: var(--text-secondary); max-width: 600px; margin-bottom: 2.5rem; font-weight: 400; }
        
        .bento-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
        .bento-box { background: var(--bg-secondary); padding: 2.5rem; border-radius: var(--border-radius); transition: transform 0.3s ease, background 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; min-height: 300px; }
        .bento-box:hover { background: #ebebeb; transform: translateY(-5px); }
        .bento-box.dark { background: var(--text-primary); color: var(--bg-main); }
        .bento-box.dark .bento-sub { color: #aaaaaa; }
        .bento-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; letter-spacing: -0.02em;}
        .bento-sub { color: var(--text-secondary); font-size: 1rem; }
        .bento-icon { font-size: 3rem; margin-bottom: auto; }
        .span-2 { grid-column: span 2; }
        
        .modern-btn { padding: 1rem 2.5rem; background: var(--accent-color); color: white; border: none; border-radius: 50px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s ease; }
        .modern-btn:hover { transform: scale(1.03); }
        
        .contact-form input, .contact-form textarea { width: 100%; padding: 1.5rem; margin-bottom: 1rem; background: var(--bg-secondary); border: none; border-radius: 16px; font-size: 1rem; outline: none; transition: background 0.3s; }
        .contact-form input:focus, .contact-form textarea:focus { background: #ebebeb; }
        
        @media (max-width: 768px) { header { padding: 1.5rem; } nav ul { gap: 1rem; } .nav-link { font-size: 0.85rem; } .span-2 { grid-column: span 1; } h1.huge-title { font-size: 3rem; } .page-section { padding-top: 40px; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">PORTFOLIO.</div>
        <nav>
            <ul>
                <li class="nav-link active" onclick="showPage('home', this)">Home</li>
                <li class="nav-link" onclick="showPage('about', this)">About</li>
                <li class="nav-link" onclick="showPage('works', this)">Works</li>
                <li class="nav-link" onclick="showPage('contact', this)">Contact</li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="page-section active">
            <h1 class="huge-title" id="d-hero-title">Loading...</h1> 
            <p class="lead" id="d-hero-sub">...</p>
            <button class="modern-btn" onclick="document.querySelector('[onclick*=\'works\']').click()">See Projects</button>

            <div class="bento-grid">
                 <div class="bento-box" style="height: 250px;">
                    <span class="bento-icon">✨</span>
                     <div>
                        <div class="bento-title">UI/UX Design</div>
                        <div class="bento-sub">Focus on clarity.</div>
                     </div>
                 </div>
                 <div class="bento-box dark" style="height: 250px;">
                    <span class="bento-icon">💻</span>
                     <div>
                        <div class="bento-title">Development</div>
                        <div class="bento-sub">Clean & modern code.</div>
                     </div>
                 </div>
            </div>
        </section>

        <section id="about" class="page-section">
            <h2 id="d-about-title">About Me.</h2>
            <p class="lead" id="d-about-desc">...</p>
        </section>

        <section id="works" class="page-section">
            <h2>Selected Works.</h2>
            <p class="lead">A collection of projects.</p>

            <div class="bento-grid">
                <div class="bento-box span-2" style="background: #f0f0f0; height: 400px; justify-content: flex-end;">
                    <div class="bento-title" id="d-proj1-name">Project 1</div>
                    <div class="bento-sub" id="d-proj1-sub">Description</div>
                </div>
                <div class="bento-box" style="background: #e8e8e8; height: 400px; justify-content: flex-end;">
                    <div class="bento-title" id="d-proj2-name">Project 2</div>
                    <div class="bento-sub" id="d-proj2-sub">Description</div>
                </div>
            </div>
        </section>

        <section id="contact" class="page-section">
            <h2>Let's Connect.</h2>
            <div class="bento-box dark" style="justify-content: center; align-items: center; text-align: center; margin-top: 20px;">
                <div class="bento-title" id="d-email">email@example.com</div>
            </div>
        </section>

    </main>

    <script>
        // PAGE NAVIGATION LOGIC
        function showPage(pageId, element) {
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => link.classList.remove('active'));
            if (element) element.classList.add('active');

            const sections = document.querySelectorAll('.page-section');
            sections.forEach(section => {
                if(section.classList.contains('active')) {
                    section.style.opacity = '0';
                    section.style.transform = 'translateY(-20px)';
                     setTimeout(() => { section.classList.remove('active'); section.style.transform = ''; }, 300);
                }
            });

             setTimeout(() => {
                const target = document.getElementById(pageId);
                if (target) {
                    target.classList.add('active');
                    void target.offsetWidth; 
                    target.style.opacity = '1';
                    target.style.transform = 'translateY(0)';
                }
             }, 300);
        }

        // --- NEW: FETCH DATA FROM FILE ---
        // This function reads the 'data.json' file and updates the HTML
        async function loadContent() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error("Could not find data.json");
                
                const data = await response.json();

                // Update Home
                document.getElementById('d-hero-title').innerHTML = data.heroTitle;
                document.getElementById('d-hero-sub').innerText = data.heroSub;
                
                // Update About
                document.getElementById('d-about-title').innerText = data.aboutTitle;
                document.getElementById('d-about-desc').innerText = data.aboutDesc;

                // Update Projects
                if(data.projects) {
                    document.getElementById('d-proj1-name').innerText = data.projects[0]?.name || "Project 1";
                    document.getElementById('d-proj1-sub').innerText = data.projects[0]?.sub || "Details";
                    document.getElementById('d-proj2-name').innerText = data.projects[1]?.name || "Project 2";
                    document.getElementById('d-proj2-sub').innerText = data.projects[1]?.sub || "Details";
                }

                // Update Contact
                document.getElementById('d-email').innerText = data.email;

            } catch (error) {
                console.log("Error loading content (Might be CORS if opening local file):", error);
                // Fallback content if file not found
                document.getElementById('d-hero-title').innerHTML = "Welcome.<br>Please load data.";
            }
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', loadContent);
    </script>
</body>
</html>
