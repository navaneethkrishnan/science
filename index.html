<script>
        document.getElementById('year').innerText = new Date().getFullYear();

        async function loadContent() {
            try {
                // CACHE BUSTING TRICK:
                // We add '?v=' + time to the URL so the browser thinks it's a new file every time.
                const uniqueUrl = 'data.json?v=' + new Date().getTime();
                
                console.log("Fetching: " + uniqueUrl);
                const response = await fetch(uniqueUrl);
                
                if (!response.ok) {
                    throw new Error("File found but could not be loaded.");
                }

                const data = await response.json();
                console.log("Data Received:", data);

                // Check if keys exist, otherwise show debug info
                if(!data.motto) {
                    throw new Error("JSON file exists, but 'motto' is missing inside it. Check spelling.");
                }

                // Update UI
                document.getElementById('d-motto').innerText = data.motto;
                document.getElementById('d-desc').innerText = data.description;

                const container = document.getElementById('blog-container');
                container.innerHTML = ''; 

                if(data.articles && data.articles.length > 0) {
                    data.articles.forEach(article => {
                        const card = `
                            <div class="card">
                                <h3>${article.title}</h3>
                                <span class="date">${article.date}</span>
                                <p>${article.content}</p>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                } else {
                    container.innerHTML = '<p style="text-align:center">No articles found.</p>';
                }

            } catch (error) {
                console.error(error);
                document.getElementById('d-motto').innerHTML = "Data Error";
                document.getElementById('d-desc').innerHTML = `
                    <span style="color: #fca5a5;">
                        വിവരങ്ങൾ എടുക്കാൻ സാധിക്കുന്നില്ല.<br>
                        <strong>കാരണം:</strong> ${error.message}<br>
                        (Check your data.json content format)
                    </span>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', loadContent);
    </script>
