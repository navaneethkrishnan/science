<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Navalokam | Science</title>
    <style>
        /* --- CSS VARIABLES (WHITE THEME) --- */
        :root {
            --bg-main: #ffffff;
            --bg-secondary: #f4f4f5;
            --text-primary: #18181b;
            --text-secondary: #71717a;
            --accent-color: #000000;
            --border-radius: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text-primary); 
            overflow-x: hidden; 
            line-height: 1.6; 
        }

        /* HEADER */
        header {
            position: fixed; top: 0; left: 0; width: 100%; padding: 1.5rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); z-index: 100;
        }
        .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: -1px; text-transform: uppercase; cursor: pointer; }

        /* MAIN LAYOUT */
        main { padding-top: 120px; padding-bottom: 50px; width: 90%; max-width: 1200px; margin: 0 auto; }

        /* HERO SECTION */
        .hero { text-align: left; margin-bottom: 60px; }
        
        h1.huge-title {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            line-height: 1.1; font-weight: 800; letter-spacing: -0.03em;
            margin-bottom: 1.5rem; color: var(--text-primary);
        }

        p.lead { font-size: 1.25rem; color: var(--text-secondary); max-width: 700px; font-weight: 400; }

        /* BENTO GRID SYSTEM */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .bento-box {
            background: var(--bg-secondary);
            padding: 2.5rem;
            border-radius: var(--border-radius);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; flex-direction: column; justify-content: space-between;
            min-height: 280px;
            cursor: pointer; /* Shows hand icon */
            position: relative;
        }
        
        .bento-box:hover {
             transform: translateY(-5px);
             background: #f0f0f0;
             box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        
        /* "Read More" Arrow icon */
        .bento-box::after {
            content: '↗';
            position: absolute; top: 20px; right: 20px;
            font-size: 1.2rem; opacity: 0; transition: opacity 0.3s;
        }
        .bento-box:hover::after { opacity: 1; }

        .bento-date { font-size: 0.85rem; color: #999; margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .bento-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem; line-height: 1.2; letter-spacing: -0.02em; }
        
        /* Truncate text for preview */
        .bento-desc {
            color: var(--text-secondary); font-size: 1rem;
            display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* --- ARTICLE READER OVERLAY (POPUP) --- */
        .article-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 200;
            overflow-y: auto;
            transform: translateY(100%); /* Hidden by default (below screen) */
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 40px 5%;
        }

        .article-overlay.active { transform: translateY(0); } /* Slide Up */

        .reader-container { max-width: 800px; margin: 60px auto; }
        
        .close-btn {
            position: fixed; top: 30px; right: 30px;
            background: #f4f4f5; border: none; width: 50px; height: 50px;
            border-radius: 50%; font-size: 1.5rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; z-index: 210;
        }
        .close-btn:hover { background: #e4e4e7; }

        .full-date { color: var(--text-secondary); font-weight: 600; margin-bottom: 10px; display: block; }
        .full-title { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; line-height: 1.1; margin-bottom: 40px; }
        .full-content { 
            font-size: 1.25rem; line-height: 1.8; color: #333; 
            white-space: pre-line; /* Preserves paragraphs from CMS */
        }

        /* FOOTER */
        footer { margin-top: 80px; padding-top: 40px; border-top: 1px solid #eee; text-align: center; color: var(--text-secondary); font-size: 0.9rem;}

    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="closeArticle()">Navalokam.</div>
        <div style="font-weight: 600; font-size: 0.9rem;">Science Portal</div>
    </header>

    <main>
        <section class="hero">
            <h1 class="huge-title" id="d-motto">Science for<br>the future.</h1>
            <p class="lead" id="d-desc">Loading...</p>
        </section>

        <div class="bento-grid" id="blog-container">
            </div>

        <footer>
            <p>© <span id="year"></span> Navalokam Initiative.</p>
        </footer>
    </main>

    <div class="article-overlay" id="articleView">
        <button class="close-btn" onclick="closeArticle()">✕</button>
        <div class="reader-container">
            <span class="full-date" id="reader-date">Date</span>
            <h1 class="full-title" id="reader-title">Title</h1>
            <div class="full-content" id="reader-content">
                Content goes here...
            </div>
        </div>
    </div>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();
        
        // Global variable to store data
        let siteData = [];

        async function loadContent() {
            try {
                // Cache busting
                const uniqueUrl = 'data.json?v=' + new Date().getTime();
                const response = await fetch(uniqueUrl);
                if (!response.ok) throw new Error("Connection failed");

                const data = await response.json();
                
                // Update Hero
                if(data.motto) document.getElementById('d-motto').innerHTML = data.motto;
                if(data.description) document.getElementById('d-desc').innerText = data.description;

                // Save articles to global variable
                siteData = data.articles || [];

                // Render Grid
                const container = document.getElementById('blog-container');
                container.innerHTML = '';

                if(siteData.length > 0) {
                    siteData.forEach((article, index) => {
                        // Create a preview snippet (first 100 characters)
                        // Pass 'index' to openArticle function
                        const card = `
                            <div class="bento-box" onclick="openArticle(${index})">
                                <div>
                                    <div class="bento-date">${article.date}</div>
                                    <div class="bento-title">${article.title}</div>
                                </div>
                                <div class="bento-desc">${article.content}</div>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                } else {
                    container.innerHTML = '<p>No articles found.</p>';
                }

            } catch (error) {
                console.error(error);
                document.getElementById('d-desc').innerText = "Could not load content.";
            }
        }

        // --- NEW FUNCTIONS FOR POPUP VIEW ---

        function openArticle(index) {
            const article = siteData[index];
            if(!article) return;

            // Fill the popup with data
            document.getElementById('reader-title').innerText = article.title;
            document.getElementById('reader-date').innerText = article.date;
            document.getElementById('reader-content').innerText = article.content;

            // Show the popup (Slide Up Animation)
            document.getElementById('articleView').classList.add('active');
            
            // Disable background scrolling
            document.body.style.overflow = 'hidden';
        }

        function closeArticle() {
            // Hide the popup
            document.getElementById('articleView').classList.remove('active');
            
            // Enable background scrolling
            document.body.style.overflow = 'auto';
        }

        // Handle Escape key to close
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeArticle();
            }
        });

        window.addEventListener('DOMContentLoaded', loadContent);
    </script>
</body>
</html>
