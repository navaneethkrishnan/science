<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navalokam CMS</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .cms-box { background: white; width: 100%; max-width: 900px; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        h2 { border-bottom: 2px solid #06b6d4; padding-bottom: 10px; color: #333; }
        .section { margin-bottom: 30px; padding: 20px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; }
        
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #475569; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; margin-bottom: 15px; }
        
        .btn-green { background: #10b981; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-blue { background: #3b82f6; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1.1rem; }
        .btn-red { background: #ef4444; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; float: right; }
        
        .article-item { background: white; padding: 15px; margin-bottom: 10px; border-left: 4px solid #06b6d4; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .file-upload { background: #fffbeb; border: 2px dashed #f59e0b; padding: 20px; text-align: center; margin-bottom: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="cms-box">
        <h1>Navalokam Site Manager</h1>
        
        <div class="file-upload" onclick="document.getElementById('importFile').click()">
            📂 <b>Click here to load existing data.json</b> (For editing)
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="loadExistingData(this)">
        </div>

        <form onsubmit="event.preventDefault(); downloadJSON();">
            
            <div class="section">
                <h2>🔹 Core Details</h2>
                <label>Main Motto (ശീർഷകം)</label>
                <input type="text" id="motto" value="നമുക്ക് ഒരു നവലോകം സൃഷ്ടിക്കാൻ ഒരുമിക്കാം">
                
                <label>Description (വിവരണം)</label>
                <textarea id="desc" rows="3">പ്രപഞ്ചത്തെ അറിയാൻ സയൻസിനെ ഉപയോഗിക്കാം. ശാസ്ത്രീയ ചിന്തകൾ പങ്കുവെക്കാം.</textarea>
            </div>

            <div class="section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h2>🔹 Articles & Blogs</h2>
                    <button type="button" class="btn-green" onclick="addArticleField()">+ New Article</button>
                </div>
                <div id="articlesList">
                    </div>
            </div>

            <button class="btn-blue">💾 Download data.json</button>
        </form>
    </div>

    <script>
        // Add a new article input block
        function addArticleField(title="", date="", content="") {
            const container = document.getElementById('articlesList');
            const id = Date.now();
            const html = `
                <div class="article-item" id="art-${id}">
                    <button type="button" class="btn-red" onclick="removeArticle('art-${id}')">Delete</button>
                    <label>Title</label>
                    <input type="text" class="art-title" value="${title}" placeholder="Article Headline">
                    <label>Date</label>
                    <input type="text" class="art-date" value="${date}" placeholder="Ex: 12 Jan 2026">
                    <label>Content</label>
                    <textarea class="art-content" rows="3" placeholder="Write something...">${content}</textarea>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        function removeArticle(id) {
            document.getElementById(id).remove();
        }

        // Generate and Download JSON
        function downloadJSON() {
            const motto = document.getElementById('motto').value;
            const desc = document.getElementById('desc').value;
            
            const articles = [];
            document.querySelectorAll('.article-item').forEach(item => {
                articles.push({
                    title: item.querySelector('.art-title').value,
                    date: item.querySelector('.art-date').value,
                    content: item.querySelector('.art-content').value
                });
            });

            const data = { motto, description: desc, articles };
            const dataStr = JSON.stringify(data, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = "data.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Load existing JSON for editing
        function loadExistingData(input) {
            const file = input.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    document.getElementById('motto').value = data.motto || "";
                    document.getElementById('desc').value = data.description || "";
                    
                    const list = document.getElementById('articlesList');
                    list.innerHTML = ""; // Clear existing empty fields
                    
                    if(data.articles) {
                        data.articles.forEach(art => {
                            addArticleField(art.title, art.date, art.content);
                        });
                    }
                    alert("Data Loaded! You can edit now.");
                } catch(err) {
                    alert("Invalid JSON file!");
                }
            };
            reader.readAsText(file);
        }

        // Add one empty article by default on load
        window.onload = function() {
            // Optional: addArticleField(); 
        }
    </script>
</body>
</html>
