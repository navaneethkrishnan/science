<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website CMS Manager</title>
    <style>
        /* Same Design System */
        :root {
            --bg-main: #ffffff;
            --bg-secondary: #f4f4f5;
            --text-primary: #18181b;
            --accent-color: #000000;
            --border-radius: 16px;
        }

        body {
            background: var(--bg-secondary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text-primary);
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .cms-container {
            background: var(--bg-main);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        }

        h1 { margin-bottom: 30px; font-weight: 800; letter-spacing: -1px; }
        
        .form-group { margin-bottom: 25px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: #555; }
        
        input, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: var(--border-radius);
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }
        input:focus, textarea:focus { border-color: var(--accent-color); }

        .section-title {
            margin-top: 40px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .save-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .save-btn:hover { transform: scale(1.02); }
    </style>
</head>
<body>

    <div class="cms-container">
        <h1>CMS Manager</h1>
        <p style="margin-bottom: 30px; color: #666;">Fill details and click 'Download Data'. Place the downloaded <b>data.json</b> file in your website folder.</p>

        <form id="cmsForm" onsubmit="event.preventDefault(); generateJSON();">
            
            <div class="section-title">🏠 Home Section</div>
            <div class="form-group">
                <label>Main Heading (Use &lt;br&gt; for new lines)</label>
                <input type="text" id="heroTitle" value="Designing<br>the future,<br>simply.">
            </div>
            <div class="form-group">
                <label>Sub Heading</label>
                <textarea id="heroSub" rows="3">I'm a multidisciplinary designer crafting minimal and functional digital experiences based in Kerala.</textarea>
            </div>

            <div class="section-title">👤 About Section</div>
            <div class="form-group">
                <label>About Heading</label>
                <input type="text" id="aboutTitle" value="About Me.">
            </div>
            <div class="form-group">
                <label>About Description</label>
                <textarea id="aboutDesc" rows="4">My philosophy is simple: Less, but better. I believe good design should be invisible.</textarea>
            </div>

            <div class="section-title">💼 Projects (Bento Grid)</div>
            <div class="form-group">
                <label>Project 1 Name</label>
                <input type="text" id="proj1Name" value="Project Alpha">
                <input type="text" id="proj1Sub" value="Fintech App Redesign" style="margin-top:5px;">
            </div>
            <div class="form-group">
                <label>Project 2 Name</label>
                <input type="text" id="proj2Name" value="Studio Minimalist">
                <input type="text" id="proj2Sub" value="Branding Identity" style="margin-top:5px;">
            </div>

            <div class="section-title">✉️ Contact Info</div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="text" id="email" value="hello@anjaly.design">
            </div>

            <button class="save-btn">Download data.json</button>
        </form>
    </div>

    <script>
        function generateJSON() {
            // Collect Data
            const data = {
                heroTitle: document.getElementById('heroTitle').value,
                heroSub: document.getElementById('heroSub').value,
                aboutTitle: document.getElementById('aboutTitle').value,
                aboutDesc: document.getElementById('aboutDesc').value,
                projects: [
                    { name: document.getElementById('proj1Name').value, sub: document.getElementById('proj1Sub').value },
                    { name: document.getElementById('proj2Name').value, sub: document.getElementById('proj2Sub').value }
                ],
                email: document.getElementById('email').value
            };

            // Create File
            const dataStr = JSON.stringify(data, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            // Download Trigger
            const a = document.createElement('a');
            a.href = url;
            a.download = "data.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
